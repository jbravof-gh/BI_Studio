<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="mask-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141518" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <linearGradient id="dc-grad-mask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5865f2" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Full Background for Maskable Icon Safe Zone -->
  <rect width="512" height="512" fill="url(#mask-bg)" />

  <!-- Center Card Emblem within 80% Safe Zone (radius ~200px) -->
  <g transform="translate(40, 40) scale(0.84)">
    <rect x="56" y="56" width="400" height="400" rx="80" fill="url(#dc-grad-mask)" />

    <!-- Top Left KPI Box -->
    <rect x="100" y="100" width="136" height="136" rx="28" fill="#ffffff" fill-opacity="0.95" />
    <path d="M120 142h96M120 172h64M120 202h40" stroke="#5865f2" stroke-width="10" stroke-linecap="round" />
    <circle cx="200" cy="202" r="10" fill="#38bdf8" />

    <!-- Top Right Metric Cards -->
    <rect x="264" y="100" width="148" height="64" rx="20" fill="#ffffff" fill-opacity="0.85" />
    <path d="M284 132h108" stroke="#7c3aed" stroke-width="10" stroke-linecap="round" />

    <rect x="264" y="180" width="148" height="56" rx="18" fill="#ffffff" fill-opacity="0.7" />
    <path d="M284 208h72" stroke="#0f1015" stroke-width="9" stroke-linecap="round" />

    <!-- Bottom Chart Area -->
    <rect x="100" y="264" width="312" height="148" rx="34" fill="#0f1015" fill-opacity="0.45" />
    <!-- Sparkline Graph -->
    <path d="M130 370 L185 320 L248 348 L312 298 L378 335" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="312" cy="298" r="14" fill="#38bdf8" />
    <circle cx="185" cy="320" r="10" fill="#ffffff" />
  </g>
</svg>
